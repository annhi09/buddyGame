<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Library | BuddyGame</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      margin:0;
      padding:24px;
      background:#f6f8ff;
      color:#223;
    }
    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:16px;
      margin-top:18px;
    }
    .card{
      background:#fff;
      border:1px solid #dfe6ff;
      border-radius:18px;
      padding:16px;
      box-shadow:0 8px 20px rgba(0,0,0,.06);
    }
    .muted{ color:#667; }
    .row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    button,a.btn{
      border:none;
      border-radius:12px;
      padding:10px 14px;
      background:#2d6bff;
      color:#fff;
      cursor:pointer;
      text-decoration:none;
      display:inline-block;
      font-weight:700;
    }
    button.secondary, a.btn.secondary{
      background:#eef3ff;
      color:#3553a6;
    }
    .status-pill{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      margin-top:10px;
    }
    .status-downloaded{
      background:#eafaf1;
      color:#117a3f;
    }
    .status-not-downloaded{
      background:#fff4e5;
      color:#a66300;
    }
    .thumb{
      width:100%;
      height:150px;
      object-fit:cover;
      border-radius:12px;
      background:#eef3ff;
      margin-bottom:12px;
    }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1 style="margin:0;">My Library</h1>
      <div class="muted">Owned packs and offline downloads</div>
    </div>
    <div class="row">
      <a class="btn secondary" href="./index.html">Home</a>
      <a class="btn secondary" href="./marketplace.html">Marketplace</a>
    </div>
  </div>

  <div id="library-status" class="muted" style="margin-top:14px;">Loading library...</div>
  <div id="library-list" class="grid"></div>

  <script type="module" src="./js/my-library.js"></script>
</body>
</html>
