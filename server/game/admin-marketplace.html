<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Review | BuddyGame</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      margin:0;
      padding:24px;
      background:#f6f8ff;
      color:#223;
    }
    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .filters{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:16px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:16px;
      margin-top:18px;
    }
    .card{
      background:#fff;
      border:1px solid #dfe6ff;
      border-radius:18px;
      padding:16px;
      box-shadow:0 8px 20px rgba(0,0,0,.06);
    }
    .thumb{
      width:100%;
      height:160px;
      object-fit:cover;
      border-radius:12px;
      background:#eef3ff;
      margin-bottom:12px;
    }
    .muted{ color:#667; }
    .row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    button,a.btn{
      border:none;
      border-radius:12px;
      padding:10px 14px;
      background:#2d6bff;
      color:#fff;
      cursor:pointer;
      text-decoration:none;
      display:inline-block;
      font-weight:700;
    }
    button.secondary,a.btn.secondary{
      background:#eef3ff;
      color:#3553a6;
    }
    button.danger{
      background:#ef5d65;
    }
    button.green{
      background:#13a66a;
    }
    .tag{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      background:#eef3ff;
      color:#3553a6;
      font-size:12px;
      font-weight:700;
      margin-top:10px;
    }

    .modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(17,27,52,.45);
  padding:20px;
  z-index:60;
}
.modal.open{ display:flex; }

.modal-card{
  width:min(860px,100%);
  max-height:88vh;
  overflow:auto;
  background:#fff;
  border:1px solid #dfe6ff;
  border-radius:24px;
  padding:20px;
  box-shadow:0 18px 40px rgba(0,0,0,.14);
}

.preview-grid{
  display:grid;
  grid-template-columns:320px 1fr;
  gap:18px;
}

.preview-cover{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:16px;
  background:#eef3ff;
  border:1px solid #dfe8ff;
}

.preview-fallback{
  width:100%;
  height:220px;
  border-radius:16px;
  background:#eef3ff;
  border:1px solid #dfe8ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2rem;
  color:#5d709f;
}

.preview-tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.preview-tag{
  display:inline-flex;
  padding:6px 10px;
  border-radius:999px;
  background:#eef3ff;
  color:#3553a6;
  font-size:12px;
  font-weight:700;
}

@media (max-width: 820px){
  .preview-grid{
    grid-template-columns:1fr;
  }
}
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1 style="margin:0;">Admin Marketplace Review</h1>
      <div class="muted">Review, approve, reject, and publish creator packs</div>
    </div>
    <div class="row">
      <a class="btn secondary" href="./index.html">Home</a>
      <a class="btn secondary" href="./creator.html">Creator</a>
    </div>
  </div>

  <div class="filters">
    <input id="search-input" type="text" placeholder="Search packs..." style="padding:10px 12px;border-radius:12px;border:1px solid #ccd6ff;min-width:220px;" />
    <select id="status-filter" style="padding:10px 12px;border-radius:12px;border:1px solid #ccd6ff;">
      <option value="review">Review</option>
      <!-- <option value="unpublished">Approved</option> -->
       <option value="approved">Approved</option>
      <option value="published">Published</option>
      <option value="rejected">Rejected</option>
      <option value="">All statuses</option>
    </select>
    <button id="refresh-btn" class="secondary">Refresh</button>
  </div>

  <div id="admin-status" class="muted" style="margin-top:14px;">Loading review queue...</div>
  <div id="admin-list" class="grid"></div>

  <div class="modal" id="admin-preview-modal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h3 id="admin-preview-title">Pack Preview</h3>
        <div class="muted">Admin review preview</div>
      </div>
      <button class="close-btn" id="admin-preview-close-btn" type="button">✕</button>
    </div>

    <div id="admin-preview-body"></div>
  </div>
</div>

  <script type="module" src="./js/admin-marketplace.js"></script>
</body>
</html>
