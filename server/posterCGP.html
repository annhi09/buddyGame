<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuddyGame | Athena & Aria Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Quicksand:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --glass:rgba(255,255,255,0.10);
      --glass-border:rgba(255,255,255,0.22);
      --text:#ffffff;
      --muted:rgba(255,255,255,0.84);

      --games:#8be9ff;
      --creator:#d2c2ff;
      --login:#ffffff;

      --shadow:0 24px 60px rgba(0,0,0,0.28);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html, body{
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:'Outfit', sans-serif;
      background:#0a0f1d;
      color:var(--text);
    }

    body{
      position:relative;
    }

    /* ===== BACKGROUND LAYERS ===== */

    .scene{
      position:fixed;
      inset:0;
      overflow:hidden;
      z-index:0;
    }

    .bg-scroll{
      position:absolute;
      inset:0;
      overflow:hidden;
    }

    .bg-track{
      display:flex;
      width:200%;
      height:100%;
      animation:bgMove 55s linear infinite;
      will-change:transform;
    }

    .bg-panel{
      flex:0 0 50%;
      height:100%;
      background-image: url('./icons/GeAAposter.png');
      /* background-repeat:repeat-x;  */
      background-repeat: no-repeat;
      background-size: contain;
      background-position:center center;
      /* transform:scale(1);  */

      position: fixed;
      /* top: 0; left: 0; */
      width: 100%; 
      height: 100%;
      /* z-index: -1; */
    }

    @keyframes bgMove{
      from{ transform:translateX(0); }
      to{ transform:translateX(-50%); }
    }

    .bg-overlay{
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at center, rgba(12,18,34,0.10) 0%, rgba(10,16,32,0.38) 52%, rgba(5,8,18,0.76) 100%),
        linear-gradient(180deg, rgba(8,12,22,0.20) 0%, rgba(8,12,22,0.50) 100%);
      z-index:1;
      pointer-events:none;
    }

    .bg-stripes{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    linear-gradient(
      135deg,
      rgba(173, 216, 255, 0.00) 0%,
      rgba(173, 216, 255, 0.00) 52%,

      rgba(173, 216, 255, 0.10) 52.8%,
      rgba(255, 255, 255, 0.18) 54.2%,
      rgba(173, 216, 255, 0.06) 55.6%,
      rgba(173, 216, 255, 0.00) 57%,

      rgba(173, 216, 255, 0.00) 60%,
      rgba(173, 216, 255, 0.09) 61.2%,
      rgba(255, 255, 255, 0.15) 62.4%,
      rgba(173, 216, 255, 0.05) 63.6%,
      rgba(173, 216, 255, 0.00) 65%,

      rgba(173, 216, 255, 0.00) 68%,
      rgba(173, 216, 255, 0.08) 69.2%,
      rgba(255, 255, 255, 0.13) 70.3%,
      rgba(173, 216, 255, 0.05) 71.4%,
      rgba(173, 216, 255, 0.00) 72.6%,

      rgba(173, 216, 255, 0.00) 76%,
      rgba(173, 216, 255, 0.07) 77%,
      rgba(255, 255, 255, 0.12) 78.1%,
      rgba(173, 216, 255, 0.04) 79.2%,
      rgba(173, 216, 255, 0.00) 80.3%
    );
  mix-blend-mode: screen;
  opacity:.85;
}

    .bg-vignette{
      position:absolute;
      inset:0;
      box-shadow:inset 0 0 180px rgba(0,0,0,0.46);
      z-index:2;
      pointer-events:none;
    }

    .bg-glow{
      position:absolute;
      inset:-10%;
      background:
        radial-gradient(circle at 20% 40%, rgba(129,161,255,0.10), transparent 20%),
        radial-gradient(circle at 80% 30%, rgba(151,113,255,0.10), transparent 18%),
        radial-gradient(circle at 60% 80%, rgba(104,212,255,0.08), transparent 16%);
      animation:glowDrift 14s ease-in-out infinite alternate;
      z-index:3;
      pointer-events:none;
    }

    @keyframes glowDrift{
      from{ transform:translateX(-10px) translateY(0px); }
      to{ transform:translateX(10px) translateY(-10px); }
    }

    /* ===== CONTENT ===== */

    .shell{
      position:relative;
      z-index:10;
      width:min(92%, 760px);
      min-height:100%;
      margin:0 auto;
      display:grid;
      place-items:center;
      text-align:center;
      padding:28px 18px;
      animation:fadeUp 1s ease-out;
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(18px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .inner{
      width:100%;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.16);
      background:rgba(255,255,255,0.06);
      backdrop-filter:blur(6px);
      color:rgba(255,255,255,0.88);
      font-size:0.92rem;
      font-weight:700;
      letter-spacing:0.02em;
      margin-bottom:18px;
    }

    .title{
      font-family:'Quicksand', sans-serif;
      font-size:clamp(2.9rem, 7vw, 5.6rem);
      line-height:0.96;
      letter-spacing:-0.05em;
      text-shadow:0 10px 30px rgba(0,0,0,0.46);
    }

    .subtitle{
      margin:18px auto 0;
      max-width:660px;
      font-size:1.08rem;
      line-height:1.7;
      color:var(--muted);
      text-shadow:0 6px 24px rgba(0,0,0,0.36);
    }

    .main-card{
      width:min(100%, 540px);
      margin:34px auto 0;
      padding:18px;
      background:var(--glass);
      backdrop-filter:blur(16px);
      border:1px solid var(--glass-border);
      border-radius:28px;
      box-shadow:var(--shadow);
    }

    .nav-stack{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .entry-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      min-height:58px;
      padding:16px 18px;
      border-radius:18px;
      text-decoration:none;
      font-size:1rem;
      font-weight:800;
      color:#fff;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.14);
      transition:transform .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease;
    }

    .entry-btn:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,0.16);
      border-color:rgba(255,255,255,0.28);
      box-shadow:0 14px 30px rgba(0,0,0,0.18);
    }

    .entry-btn.games{ color:var(--games); }
    .entry-btn.creator{ color:var(--creator); }
    .entry-btn.login{ color:var(--login); }

    .footer-links{
      margin-top:18px;
      display:flex;
      justify-content:center;
      gap:18px;
      flex-wrap:wrap;
      font-size:0.82rem;
      opacity:0.82;
    }

    .footer-links a{
      color:rgba(255,255,255,0.78);
      text-decoration:none;
      font-weight:600;
      transition:opacity .2s ease, color .2s ease;
    }

    .footer-links a:hover{
      color:#fff;
      opacity:1;
    }

    @media (max-width:640px){
      .shell{
        width:min(94%, 760px);
        padding:22px 12px;
      }

      .subtitle{
        font-size:1rem;
      }

      .main-card{
        padding:14px;
        border-radius:22px;
      }

      .entry-btn{
        min-height:54px;
        font-size:0.96rem;
      }
    }

    @media (prefers-reduced-motion: reduce){
      .bg-track,
      .bg-glow,
      .shell{
        animation:none !important;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    
    <div class="bg-scroll">
      <div class="bg-track">
        <div class="bg-panel"></div>
        <div class="bg-panel"></div>
      </div>
    </div>
    <div class="bg-overlay"></div>
    <!-- <div class="bg-stripes"></div> -->
    <div class="bg-vignette"></div>
    <div class="bg-glow"></div>
  </div>

  <main class="shell">
    <div class="inner">
      <div class="eyebrow">Athena &amp; Aria Studio</div>

      <h1 class="title">BuddyGame</h1>

      <p class="subtitle">
        A playful learning world for children, and an elegant creator space for teachers,
        parents, and storytellers.
      </p>

      <section class="main-card">
        <nav class="nav-stack">
          <a href="./words.html" class="entry-btn games">🎮 Play Games</a>
          <a href="./creator.html" class="entry-btn creator">🛠️ Creator Studio</a>
          <a href="#login" class="entry-btn login">👤 Authorization</a>
        </nav>

        <div class="footer-links">
          <a href="#about">About</a>
          <a href="#support">Support</a>
          <a href="#privacy">Privacy</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
